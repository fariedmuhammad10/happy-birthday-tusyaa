<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>buat tusyaa 🍓💌</title>
  <meta name="description" content="ada email baru dari payittt, buka yaa 🍓" />
  <meta name="theme-color" content="#faf6f4" />

  <!-- link preview (WhatsApp / IG / etc) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="haii tusyaa! you've got new emails 🍓💌" />
  <meta property="og:description" content="dari payittt — buka satu-satu yaa ♡" />
  <meta property="og:image" content="https://fariedmuhammad10.github.io/happy-birthday-tusyaa/assets/og.jpg" />
  <meta property="og:url" content="https://fariedmuhammad10.github.io/happy-birthday-tusyaa/" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-hearts" aria-hidden="true"></div>

  <!-- ============ SCREEN 1 : ENVELOPE ============ -->
  <section id="intro" class="screen active">
    <p class="hand intro-title" id="introTitle">haii tusyaa!</p>

    <button class="envelope" id="envelope" aria-label="buka email">
      <span class="env-back"></span>
      <span class="env-letter">
        <span class="hand" id="envFor">for tusyaa 🍓</span>
      </span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="env-heart">
        <svg viewBox="0 0 32 29" aria-hidden="true"><path d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/></svg>
      </span>
    </button>

    <p class="hand intro-sub">you've got new emails</p>
    <p class="intro-hint">tap amplopnya yaa 🍓</p>
  </section>

  <!-- ============ SCREEN 2 : INBOX ============ -->
  <section id="inbox" class="screen">
    <div class="app">
      <header class="app-header">
        <div class="app-top">
          <div>
            <p class="app-kicker">strawberry mail 🍓</p>
            <h1 class="app-title">Inbox</h1>
          </div>
          <div class="avatar-wrap">
            <img class="me-avatar" src="photos/foto-03.jpg" alt="tusyaa" />
            <span class="avatar-badge" aria-hidden="true">🍓</span>
          </div>
        </div>
        <div class="search" id="searchBar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span id="searchText">kiriman dari payittt...</span>
        </div>
        <div class="tabs" id="inboxTabs">
          <button class="tab active" data-filter="all">Semua <b id="unreadCount">6</b></button>
          <button class="tab" data-filter="unread">Belum dibaca</button>
          <button class="tab" data-filter="fav">Spesial 🍓</button>
        </div>
      </header>

      <ul class="mail-list" id="mailList"></ul>

      <p class="list-foot">kotak masuk ini cuma buat <b id="footName">tusyaa</b> 🍓🌿</p>
    </div>
  </section>

  <!-- ============ SCREEN 3 : MAIL VIEW ============ -->
  <section id="mail" class="screen">
    <div class="app">
      <header class="mail-bar">
        <button class="icon-btn" id="backBtn" aria-label="kembali">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="mail-bar-actions">
          <span class="mail-tag">🍓 birthday mail</span>
        </div>
      </header>

      <article class="mail-view">
        <h2 class="mail-subject" id="mailSubject"></h2>
        <div class="mail-meta">
          <div class="avatar heart-avatar" id="mailAvatar">🍓</div>
          <div class="meta-text">
            <p><b id="metaFrom">payittt</b> <span class="muted" id="metaAddr">&lt;payittt@strawberry.mail&gt;</span></p>
            <p class="muted">ke: <span id="metaTo">tusyaa</span> ♡ · <span id="mailTime"></span></p>
          </div>
        </div>
        <div class="mail-body" id="mailBody"></div>
      </article>
    </div>
  </section>

  <!-- lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="tutup">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="sebelumnya">‹</button>
    <figure>
      <img id="lbImg" alt="" />
      <figcaption class="hand" id="lbCap"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lbNext" aria-label="berikutnya">›</button>
  </div>

  <!-- toast -->
  <div class="toast" id="toast"></div>

  <!-- music toggle -->
  <button class="music-btn" id="musicBtn" aria-label="musik">♫</button>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
